<!DOCTYPE html>
<html lang="zh-CN" data-app-id="shh13-mcp-hub">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP Hub</title>
<link rel="stylesheet" href="./app.css?v=1.0.1">
<style>
  :root { --app-accent: #B45309; --app-accent-weak: #fdf3e3; }
  @media (prefers-color-scheme: dark) { :root { --app-accent-weak: #2a2113; } }

  .level-cards { display: flex; flex-wrap: wrap; gap: 10px; }
  .level-card {
    flex: 1; min-width: 210px; border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 12px 14px; cursor: pointer;
    background: var(--surface);
  }
  .level-card:hover { background: var(--surface-2); }
  .level-card.active { border-color: var(--app-accent); background: var(--app-accent-weak); }
  .level-card .t { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .level-card .d { font-size: 12px; color: var(--text-soft); margin-top: 4px; }
  .level-card.danger .t { color: var(--danger); }

  .tool-item { border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; overflow: hidden; }
  .tool-item > header {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--surface-2); cursor: pointer;
  }
  .tool-item > header .nm { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .tool-item > header .grow { flex: 1; min-width: 0; }
  .tool-item .desc { padding: 8px 12px; font-size: 12.5px; color: var(--text-soft); }
  .tool-item .schema {
    padding: 0 12px 10px; font-family: var(--mono); font-size: 11.5px;
    white-space: pre-wrap; word-break: break-all; color: var(--text-faint);
  }
  .tool-item.disabled { opacity: .55; }

  .cfg { position: relative; }
  .cfg pre {
    font-family: var(--mono); font-size: 12px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; overflow-x: auto; margin: 0 0 6px;
  }
  .picker-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .picker-row .path {
    flex: 1; font-family: var(--mono); font-size: 12.5px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .picker-row .path.empty { color: var(--text-faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 4px 6px 4px 10px; font-size: 12.5px; font-family: var(--mono); max-width: 100%;
  }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip button { border: 0; background: none; cursor: pointer; color: var(--text-faint); padding: 0 2px; }
  .chip button:hover { color: var(--danger); }
  .audit-deny { color: var(--danger); }
  .audit-ok { color: var(--ok); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 512 512" width="22" height="22" aria-hidden="true">
        <rect x="32" y="32" width="448" height="448" rx="104" fill="#B45309"/>
        <text x="256" y="268" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif"
              font-size="104" font-weight="700" text-anchor="middle"
              dominant-baseline="central" letter-spacing="2">MCP</text>
      </svg>
      <span class="name">MCP Hub</span>
    </div>
    <span class="meta" id="level-meta"></span>
    <span class="spacer"></span>
    <span class="meta" id="app-version"></span>
  </header>
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>
  <div class="taskbar" id="taskbar"></div>
</div>
<div id="toasts" class="toasts"></div>

<script src="./icons.js?v=1.0.1"></script>
<script src="./app.js?v=1.0.1"></script>
<script src="./mcp.js?v=1.0.1"></script>
</body>
</html>
